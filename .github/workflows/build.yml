name: Build Vivo Browser AdBlock

on:
  workflow_dispatch:
  push:
    paths:
      - "vivo_browser_adblock_api102_source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check source ZIP
        run: |
          echo "===== ZIP contents ====="
          unzip -l vivo_browser_adblock_api102_source.zip
          echo "===== Extract source ====="
          unzip -o vivo_browser_adblock_api102_source.zip -d extracted
          echo "===== Project files ====="
          find extracted -maxdepth 5 -type f | head -200

      - name: Locate Android project
        run: |
          MANIFEST="$(find extracted -type f -path '*/app/src/main/AndroidManifest.xml' -print -quit)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::ZIP 中没有找到 app/src/main/AndroidManifest.xml"
            exit 1
          fi
          PROJECT_DIR="${MANIFEST%/app/src/main/AndroidManifest.xml}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
          sed -i 's/android:description="[^"]*"//g' "$MANIFEST"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivo-browser-adblock-build
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
            extracted/**/app/build/reports/**
          if-no-files-found: warn

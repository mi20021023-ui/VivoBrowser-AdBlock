name: Build Vivo Browser AdBlock

on:
  workflow_dispatch:
  push:
    paths:
      - "vivo_browser_adblock_api102_source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses

      - name: Extract source
        run: unzip -o vivo_browser_adblock_api102_source.zip
        background:
      
      - name: Fix manifest description resource
        run: |
          sed -i 's/android:description="[^"]*"//g' vivo_browser_adblock_api102/app/src/main/AndroidManifest.xml
          echo "Manifest fix applied"
      
      - name: Build APK
        working-directory: vivo_browser_adblock_api102
        run: gradle --no-daemon assembleDebug

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivo-browser-adblock-build
          path: |
            vivo_browser_adblock_api102/app/build/outputs/apk/debug/*.apk
            vivo_browser_adblock_api102/app/build/reports/**
          if-no-files-found: warn
